<title>Purify — The Path of Cleansing</title>
<style>
  :root { --p:#b4c9a6; --p2:#8fa77f; --g:#cdb787; --t:#ebe5d6; --m:#a9b4ac; --card:rgba(235,229,214,.05); --line:rgba(235,229,214,.1); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:#192428; color:var(--t); font-size:16px; line-height:1.55; }
  .app { max-width:480px; margin:0 auto; height:100vh; height:100dvh; background:linear-gradient(180deg,#1e2c31 0%,#22333a 55%,#263a3f 100%); position:relative; overflow:hidden; }
  .view { display:none; flex-direction:column; height:100%; position:relative; z-index:1; }

  .top { display:flex; align-items:center; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 10px 8px; min-height:60px; }

  .dot.on { background:var(--p); width:22px; }
  .body { flex:1; overflow-y:auto; padding:6px 20px 28px; -webkit-overflow-scrolling:touch; }
  .foot { padding:10px 20px calc(16px + env(safe-area-inset-bottom)); }

  h2 { font-size:23px; color:var(--p); margin:4px 0 6px; line-height:1.35; }

  .btn.ghost { background:rgba(255,255,255,.05); color:var(--t); border:1px solid var(--line); font-weight:600; }

  .nav button { flex:1; border:none; background:transparent; color:var(--m); font-size:13px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }

function weightChart(W, H) {

  s += '<polyline fill="none" stroke="#b4c9a6" stroke-width="2.5" stroke-linejoin="round" points="' + pts.map(p => X(p.d).toFixed(1) + ',' + Y(p.kg).toFixed(1)).join(' ') + '"/>';

  const n = S.afNote; if (!n || n.sid !== afSid()) return '';
  const s = AF_STAGES.find(x => x.h === n.h); if (!s) return '';
  return '<div class="card afnote" id="afNote"><div class="row" style="align-items:flex-start;"><div class="grow"><p style="margin:0;"><b>🔔 ' + (s.h === AF_ON ? 'Your autophagy switch may be starting to turn on' : s.t) + '</b></p><p class="muted" style="margin:4px 0 0;">' + s.m + '</p>' +
    (s.h === AF_ON ? '<p class="vline">“' + vt('2 Corinthians 4:16') + '” <span>— 2 Corinthians 4:16</span></p>' : '') + '</div><button class="btn sm sec" style="width:auto;" onclick="S.afNote=null;save();rerender()">Close</button></div></div>';
}

function afCheck(silent) {
  const sid = afSid(); if (!sid) return;
  const h = afHours(), i = afStage(h);
  if (!S.af || S.af.sid !== sid) S.af = { sid, seen:[] };
  let fresh = null;
  AF_STAGES.forEach((s, k) => { if (k > 0 && k <= i && !S.af.seen.includes(s.h)) { S.af.seen.push(s.h); fresh = s; } });
  if (!fresh) return;
  S.afNote = { sid, h:fresh.h }; save();
  if (silent) return;
  const msg = fresh.h === AF_ON ? '🔆 Your autophagy switch may be starting to turn on' : fresh.icon + ' ' + fresh.t;
  toast(msg, 4200);
  try { if (window.Notification && Notification.permission === 'granted' && document.hidden) new Notification('Purify', { body:msg, icon:'icons/icon-192.png' }); } catch(e) {}
  if (curTab === 'today' && document.getElementById('afsw')) rerender();
}
function afTick() {
  const sw = document.getElementById('afsw'); if (!sw) return;
  const h = afHours(), i = afStage(h), was = +sw.dataset.stage;
  afCheck();
  if (sw.dataset.stage === undefined || isNaN(was)) sw.dataset.stage = i;
  else if (was !== i) { const box = sw.parentNode; sw.outerHTML = afSwitch(h); const n = document.getElementById('afsw'); if (n) { n.dataset.stage = i; n.classList.add('flip'); } return; }
  const nx = AF_STAGES[i + 1], b = document.getElementById('afbar');
  if (b && nx) b.style.width = Math.min(100, (h - AF_STAGES[i].h) / (nx.h - AF_STAGES[i].h) * 100).toFixed(1) + '%';
}
setInterval(() => { try { if (typeof S !== 'undefined' && S && S.onboarded) { if (curTab === 'today') afTick(); else afCheck(); } } catch(e) {} }, 1000);

  const how = (secs.filter(x => (I.eat && x.indexOf(I.eat.slice(0, 20)) >= 0) || (I.day && I.day[0] && x.indexOf(I.day[0].slice(0, 20)) >= 0)).join('')) + '<ul class="l">' + p.items.map(x => '<li>✓ ' + x + '</li>').join('') + '</ul>';
  const bgSec = I.bg ? secs.filter(x => x.indexOf(I.bg.slice(0, 20)) >= 0).join('') : '';
  const panes = [ov, how,
    '<p><span class="sfb">' + safetyBadge(id) + '</span></p>' + (!a.ok ? '<p>🔒 ' + a.reason + '</p>' : a.needDoctor ? '<p>🔒 ' + a.reason + '</p>' : a.caution ? '<p>⚠ ' + a.caution + '</p>' : '') + '<p>' + TX.sfCommon + '</p><ul class="l">' + STOP_LIST.map(s => '<li>' + s + '</li>').join('') + '</ul>',
    '<p>' + fast + '</p>',
    bgSec || (refs.length ? refs.map(r => '<p class="vline">“' + vt(r) + '” <span>— ' + r + '</span></p>').join('') : '<p>' + TX.noVerse + '</p>')
  ];
  return '<div class="steps" data-steps="' + id + '"><div class="stabs" role="tablist">' + names.map((n, i) => '<button type="button" role="tab" class="' + (i ? '' : 'on') + '" onclick="spTab(this,' + i + ')">' + n + '</button>').join('') + '</div>' +
    panes.map((x, i) => '<div class="spane' + (i ? '' : ' on') + '" data-pane="' + i + '">' + x + '</div>').join('') + '</div>';
}
progCard = function (id, rec) {
  const sel = D.progId === id, p = PROGRAMS[id];
  return '<div class="pcard' + (sel ? ' sel' : '') + (id === 'waterfast' ? ' devo-card' : '') + '">' + progOpt(id, rec) +
    '<div class="psum" data-sum="' + id + '"><span class="sfb">' + safetyBadge(id) + '</span>' + (p.who ? '<p><b>' + TX.pWho + '</b> ' + p.who + '</p>' : '') +
    '<p><b>' + TX.pKey + '</b></p><ul class="l">' + progItemsFor(id).slice(0, 3).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' +
    '<details class="more" data-more="' + id + '"' + (sel ? ' open' : '') + '><summary>' + TX.details + '</summary>' + progSteps(id) + '</details>' + progExtra(id) + '</div>';
};
function progItemsFor(id) { const p = PROGRAMS[id]; return p.items.map((it, i) => (p.hasOpt && i === 2) ? it.replace(/:.*$/, '') : it); }
const _compareTable0 = compareTable; compareTable = function () { return _compareTable0().replace('cmpwrap" open', 'cmpwrap"'); };
//
function groupCard() {
  const g = S.group, T = ymd(), t = g.notes[T] || {};
  return '<div class="card"><h3>👥 Small Group <span class="tag">Saved on this device only</span></h3>' +
    '<p style="font-size:14px; color:#efcdbf; margin:4px 0 8px;">There’s no server, so nothing syncs with other people. Use the share button to send them a summary.</p>' +
    '<div class="row"><input class="inp grow" id="grpName" placeholder="Group name" value="' + esc(g.name) + '"><button class="btn sec" style="width:80px;" onclick="saveGroupName()">Save</button></div>' +
    '<div class="row" style="margin-top:8px;"><input class="inp grow" id="memName" placeholder="Member name"><button class="btn sec" style="width:80px;" onclick="addMember()">Add</button></div>' +
    (g.members.length ? '<p class="muted" style="margin-top:10px;">Encouragement & prayer requests for today (' + fmtMD(T) + ')</p>' : '') +
    g.members.map(m => { const n = t[m.id] || {}; return '<div class="member"><div class="row"><b class="grow">' + esc(m.name) + '</b><button class="link" onclick="removeMember(\'' + m.id + '\')">Remove</button></div>' +
      '<input class="inp" placeholder="Word of encouragement" value="' + esc(n.cheer || '') + '" onchange="setMemberNote(\'' + m.id + '\',\'cheer\',this.value)">' +
      '<input class="inp" placeholder="Prayer request" value="' + esc(n.prayer || '') + '" onchange="setMemberNote(\'' + m.id + '\',\'prayer\',this.value)"></div>'; }).join('') + '</div>';
}
function saveGroupName() { S.group.name = document.getElementById('grpName').value.trim(); save(); toast('Group name saved.'); rerender(); }
function addMember() {
  const el = document.getElementById('memName'), n = el.value.trim();
  if (!n) return alert('Please enter a member name.');
  S.group.members.push({ id:'m' + now().toString(36) + Math.floor(Math.random() * 1000), name:n.slice(0, 20) }); save(); rerender();
}
function removeMember(id) {
  const m = S.group.members.find(x => x.id === id); if (!m || !confirm('Remove ' + m.name + '?')) return;
  S.group.members = S.group.members.filter(x => x.id !== id); save(); rerender();
}
function setMemberNote(id, f, v) { const T = ymd(), t = S.group.notes[T] || (S.group.notes[T] = {}); t[id] = t[id] || {}; t[id][f] = v.trim(); save(); }

function buildShareText() {
  const T = ymd(), v = verseFor(T), P = plan(), pr = PROGRAMS[progId()], x = day(T);
  const L = ['✦ Purify · The Path of Cleansing · ' + fmtMD(T)];
  if (S.group.name) L.push('[' + S.group.name + ']');
  L.push('', (S.name ? S.name + '’s day: ' : 'Today: ') + progName() + ' ' + (progActive(T) ? '· day ' + progDay(T) + ' of ' + progLen() : '· finished') + (S.program.done ? ' 🏅' : ''));
  L.push('🍽 ' + comma(eatenKcal(T)) + ' / ' + comma(P.target) + 'kcal · 🏃 ' + burnedKcal(T) + 'kcal · 💧 ' + (x.water / 1000).toFixed(1) + 'L');
  L.push('', '📖 Today’s Verse', '“' + v.t + '”', '— ' + v.r + ' (KJV)', '', '💡 In plain words: ' + v.e, '✔ Today’s step: ' + v.a);
  const t = S.group.notes[T] || {};
  const lines = S.group.members.map(m => { const n = t[m.id] || {}, ps = []; if (n.cheer) ps.push('Encouragement: ' + n.cheer); if (n.prayer) ps.push('Prayer: ' + n.prayer); return ps.length ? '- ' + m.name + ' · ' + ps.join(' / ') : ''; }).filter(Boolean);
  if (lines.length) L.push('', '👥 Walking together', ...lines);
  L.push('', '— A healthy body and a renewed heart, with God’s Word. Purify');
  return L.join('\n');
}
function fallbackCopy(txt) {
  try { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand && document.execCommand('copy'); ta.remove(); return !!ok; } catch(e) { return false; }
}
function shareText(txt, title) {
  if (navigator.share) return navigator.share({ title:title || 'Purify', text:txt }).catch(() => {});
  const done = ok => { if (ok) toast('Copied. Paste it into a text or chat.'); else prompt('Please copy the text below', txt); };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(() => done(true), () => done(fallbackCopy(txt)));
  done(fallbackCopy(txt)); return Promise.resolve();
}
function shareToday() { return shareText(buildShareText(), 'Purify · Today'); }
function askFriend() { return shareText('Hey — I’ve been building healthy habits with an app called Purify, and I’ve gotten curious about the Bible verses in it. Could we talk about it sometime? 🙂', 'Purify'); }

//
function exportData() {
  save();
  return { app:'purify', version:3, exportedAt:new Date(now()).toISOString(), data:{ purifyV3:JSON.parse(JSON.stringify(S)), purifyState:lsGet('purifyState'), purifyWater:lsGet('purifyWater'), purifyV2:lsGet('purifyV2') } };
}
function downloadBackup() {
  try {
    const blob = new Blob([JSON.stringify(exportData(), null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'purify-backup-' + ymd() + '.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500); toast('Backup file saved.');
  } catch(e) { alert('Export error: ' + e.message); }
}
function validateBackup(o) {
  const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
  if (!isObj(o) || o.app !== 'purify') return 'This isn’t a Purify backup file.';
  if (!isObj(o.data)) return 'There’s no backup data.';
  const d = o.data;
  if (d.purifyV3 != null) {
    const v = d.purifyV3;
    if (!isObj(v) || v.version !== 3) return 'The v3 data format isn’t valid.';
    if (v.profile != null && !isObj(v.profile)) return 'The profile format isn’t valid.';
    if (v.days != null && !isObj(v.days)) return 'The daily records format isn’t valid.';
    if (v.weights != null && (!Array.isArray(v.weights) || v.weights.some(w => !w || typeof w.d !== 'string' || typeof w.kg !== 'number'))) return 'The weight records format isn’t valid.';
  }
  if (d.purifyState != null && !isObj(d.purifyState)) return 'The purifyState format isn’t valid.';
  if (d.purifyWater != null && (!Array.isArray(d.purifyWater) || d.purifyWater.some(l => !l || typeof l.a !== 'number'))) return 'The water records format isn’t valid.';
  if (d.purifyV2 != null && !isObj(d.purifyV2)) return 'The purifyV2 format isn’t valid.';
  if (d.purifyV3 == null && d.purifyState == null && d.purifyWater == null && d.purifyV2 == null) return 'There are no records to import.';
  return '';
}
function applyBackup(o, skipConfirm) {
  const err = validateBackup(o);
  if (err) { alert('Import failed: ' + err); return false; }
  if (!skipConfirm && !confirm('Restore the backup (' + (o.exportedAt ? o.exportedAt.slice(0, 10) : 'no date') + ')?\nAll records on this device will be overwritten.')) return false;
  const d = o.data;
  try {
    if (d.purifyV3 != null) LSX.setItem(KEY, JSON.stringify(d.purifyV3)); else LSX.removeItem(KEY);
    LEGACY.forEach(k => { if (d[k] != null) LSX.setItem(k, JSON.stringify(d[k])); else LSX.removeItem(k); });
  } catch(e) { alert('Save error: ' + e.message); return false; }
  try { location.reload(); } catch(e) {}
  return true;
}
function importFromFile(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { let o; try { o = JSON.parse(r.result); } catch(e) { input.value = ''; return alert('Import failed: the JSON file could not be read.'); } applyBackup(o); input.value = ''; };
  r.readAsText(f);
}
function resetAll() {
  if (!confirm('Erase all records (profile, meals, weight, programs, group, etc.)? This can’t be undone.')) return;
  lsDel(KEY); LEGACY.forEach(lsDel); lsDel('purifyMusic');
  try { location.reload(); } catch(e) {}
}
